<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- خلفية كحلية بزوايا دائرية -->
  <rect width="64" height="64" rx="12" fill="#1B3A5C"/>

  <!-- حرف O — مستطيل أبيض مجوف (الإطار) -->
  <rect x="8" y="8" width="22" height="34" rx="5" fill="none" stroke="#FFFFFF" stroke-width="4"/>

  <!-- حرف F — أحمر، يبدأ من منتصف اليمين -->
  <text x="36" y="32" font-family="Arial Black, Arial, sans-serif"
        font-size="26" font-weight="900" fill="#E63329">F</text>

  <!-- حرفا Q — مربعان صغيران بيضاء في الأسفل -->
  <rect x="8"  y="48" width="10" height="10" rx="3" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  <rect x="22" y="48" width="10" height="10" rx="3" fill="none" stroke="#FFFFFF" stroke-width="3"/>
</svg>
